name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    defaults:
      run:
        working-directory: 软件/atri

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m compileall -q atri run_demo.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: No-hardware closed-loop demo
        run: python run_demo.py --fast
