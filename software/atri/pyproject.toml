[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atri-software"
version = "0.1.0"
description = "A.T.R.I. desktop humanoid robot software stack: brain-cerebellum, JSON task cards, FSM, skills and VLA adapter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

# 主包保持零第三方依赖；CAD 建模作为可选组单独安装
[project.optional-dependencies]
cad = ["cadquery>=2.5.0,<2.6"]

[project.scripts]
atri-demo = "atri.sim:main"
atri-run = "atri.run:main"

[tool.setuptools.packages.find]
include = ["atri*"]
